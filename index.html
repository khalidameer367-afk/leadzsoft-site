.socs{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.soc{width:42px;height:42px;border:1px solid var(--line);display:grid!important;place-items:center;color:var(--ink);padding:0!important;transition:.25s}.soc:hover{background:var(--accent);border-color:var(--accent);color:#fff!important;transform:translateY(-3px)}.soc svg{width:18px;height:18px;fill:currentColor}
.cvimg{display:block;max-width:none;width:calc(100% + 60px);height:190px;object-fit:cover;margin:-30px -30px 22px}.art .cvimg{width:100%;height:340px;margin:24px 0}.art .rt p{font-size:16px}
#adb{position:fixed;right:20px;bottom:20px;z-index:50;background:var(--ink);color:var(--paper);padding:12px 18px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}body.isadm header,body.isadm footer,body.isadm #adb{display:none}
.lg{max-width:420px;margin:80px auto;padding:0 24px}.lg input{margin-top:6px}.adm{display:grid;grid-template-columns:270px 1fr;min-height:100vh;align-items:start}.ab{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--tint);padding:16px 0}
.abh{font:400 22px Georgia,serif;padding:6px 20px 14px}.ag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 20px 6px}.ai{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 20px;font:500 14px Inter,sans-serif;color:var(--ink);cursor:pointer}.ai:hover{background:var(--paper)}.ai.on{border-color:var(--accent);background:var(--paper);color:var(--accent)}
.am{padding:28px 36px 80px;max-width:980px}.at{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}.at h1{font-size:1.9rem}.ax{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#sv{font-size:13px;color:#1a8a4a}#sv.bad{color:#c0392b}
.ad{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;font:500 13px Inter,sans-serif;cursor:pointer;display:inline-block}.ad:hover{border-color:var(--ink)}.dng{color:#c0392b}.ac{display:grid;gap:14px}.ac2{display:flex;gap:8px;flex-wrap:wrap}
.f{display:grid;gap:6px}.f>span{font-size:12px;font-weight:600;color:var(--muted)}.fr{display:flex;gap:8px}.fr input{flex:1}.hl{width:80px!important}.ck2{display:flex;gap:8px;align-items:center}.ck2 input{width:auto}
.bk{border:1px solid var(--line);background:var(--paper)}.bk>summary{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none;background:var(--tint)}.bk>summary::-webkit-details-marker{display:none}.bk summary em{flex:1;font-style:normal;color:var(--muted);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bk summary span button,.lc button,.sl button{border:1px solid var(--line);background:var(--paper);color:var(--ink);width:30px;height:30px;cursor:pointer}.bkb{padding:16px;display:grid;gap:14px}
.lst{display:grid;gap:10px;border:1px dashed var(--line);padding:12px}.lh{font-size:12px;font-weight:600;color:var(--muted)}.li2{border:1px solid var(--line);padding:12px;display:grid;gap:10px}.lc{display:flex;justify-content:space-between;align-items:center}.sl{display:flex;gap:6px}.sl input{flex:1}
.imf{display:flex;gap:12px;align-items:flex-start}.imf img{width:120px;height:80px;object-fit:cover;border:1px solid var(--line)}.imf>div{display:grid;gap:8px;flex:1}.slot.sm{width:120px;min-height:80px!important;font-size:12px;padding:4px}
.rtb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line);border-bottom:0;padding:6px;background:var(--tint)}.rtb button{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 9px;font-size:13px;cursor:pointer}.rtb select,.rtb input{width:auto!important;padding:5px 8px!important;font-size:13px}.lkx{width:150px!important}
.rte{border:1px solid var(--line);min-height:120px;padding:12px 14px;font-size:15px;background:var(--paper)}.rte:focus{outline:none;border-color:var(--ink)}.rte h2{font-size:1.5rem;margin:10px 0}.rte h3{font-size:1.2rem;margin:8px 0}.rte a{color:var(--accent)}
.addb{display:flex;gap:8px}.addb select{width:auto}.chk div{padding:3px 0;font-size:14px}.chk .ok{color:#1a8a4a}.chk .no{color:#c0392b}.nt{font-size:13px;color:var(--muted)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:grid;place-items:center;padding:20px}.mdb{background:var(--paper);padding:24px;width:min(720px,100%);display:grid;gap:12px}
@media(max-width:900px){.g5,.fq2{grid-template-columns:1fr}.sband .g4{grid-template-columns:1fr 1fr}.adm{grid-template-columns:1fr}.ab{position:static;height:auto;max-height:260px}.am{padding:20px}.cvimg{width:calc(100% + 60px)}}
